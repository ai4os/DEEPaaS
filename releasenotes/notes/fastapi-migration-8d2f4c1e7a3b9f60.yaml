---
upgrade:
  - |
    DEEPaaS now uses FastAPI instead of aiohttp. The model API does not
    change, but ``aiohttp`` is no longer installed, so models importing it
    (e.g. ``from aiohttp.web import HTTPBadRequest``) must remove those
    imports or declare ``aiohttp`` as their own dependency.
  - |
    Requesting (via the ``Accept`` header) a media type that the model does
    not declare in its ``accept`` argument now returns a 406 error.
deprecations:
  - |
    The ``workers`` and ``client-max-size`` options are deprecated, as they
    are ignored by the FastAPI based server.
fixes:
  - |
    Temporary files created for the uploaded files are now removed once the
    request has been served.
