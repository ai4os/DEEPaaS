---
security:
  - |
    The minimum versions of the dependencies have been raised to versions
    without known vulnerabilities: FastAPI 0.133.0 (Starlette 1.3.1),
    python-multipart 0.0.31, requests 2.33.0, aiohttp 3.14.4 and marshmallow
    3.26.2. Previous FastAPI and Starlette versions are affected by several
    denial of service vulnerabilities, some of them when parsing the uploaded
    files.
